[project]
name = "fedspeak"
version = "0.6.0"
description = "Keyword frequency and sentiment analysis of Federal Reserve FOMC minutes, with an interactive dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "vadersentiment>=3.3.2",
]

[project.scripts]
fedspeak = "fedspeak.cli:main"

[project.optional-dependencies]
stance = [
    "torch>=2.11.0",
    "transformers>=5.22.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

# CUDA builds of torch for the stance model (`uv sync --extra stance`). Windows and Linux
# take them from the PyTorch index; macOS falls back to the regular CPU build on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
