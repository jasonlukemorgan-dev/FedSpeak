[project]
name = "fedspeak"
version = "0.6.0"
description = "Keyword frequency and sentiment analysis of Federal Reserve FOMC minutes, with an interactive dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "tqdm>=4.70.1",
    "vadersentiment>=3.3.2",
]

[project.scripts]
fedspeak = "fedspeak.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
